definitions:
  SignupRequest:
    type: object
    required: [username, email, password, password_confirmation]
    properties:
      username:
        type: string
      email:
        type: string
        format: email
      password:
        type: string
        format: password
      password_confirmation:
        type: string
        format: password
      role:
        type: string
        enum: [patient, doctor]
        default: patient
  LoginRequest:
    type: object
    required: [username, password]
    properties:
      username:
        type: string
      password:
        type: string
        format: password
  AppointmentRequest:
    type: object
    required: [patient_id, doctor_id, appointment_date, start_time, end_time]
    properties:
      patient_id:
        type: integer
      doctor_id:
        type: integer
      appointment_date:
        type: string
        format: date
      start_time:
        type: string
        example: "10:00"
      end_time:
        type: string
        example: "10:30"
  PrescriptionRequest:
    type: object
    required: [patient_id, doctor_id, medicine_id, dosage, frequency, duration]
    properties:
      patient_id:
        type: integer
      doctor_id:
        type: integer
      medicine_id:
        type: integer
      dosage:
        type: string
      frequency:
        type: string
      duration:
        type: string
  MedicineRequest:
    type: object
    required: [name, price, stock_quantity]
    properties:
      name:
        type: string
      description:
        type: string
      price:
        type: number
      stock_quantity:
        type: integer
  InvoiceRequest:
    type: object
    required: [patient_id, items]
    properties:
      patient_id:
        type: integer
      items:
        type: array
        items:
          type: object
          required: [description, unit_price]
          properties:
            description:
              type: string
            quantity:
              type: integer
              default: 1
            unit_price:
              type: number
      tax_rate:
        type: number
      discount:
        type: number
