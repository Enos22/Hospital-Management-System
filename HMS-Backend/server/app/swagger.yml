swagger: "2.0"
info:
  title: AfyaCare API
  description: REST API for AfyaCare hospital management.
  version: "1.0.0"
consumes:
  - application/json
produces:
  - application/json
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
    description: "JWT access token. Enter: Bearer <access_token>"
tags:
  - name: Authentication
  - name: Administration
  - name: Doctors
  - name: Patients
  - name: Appointments
  - name: Medical Records
  - name: Prescriptions
  - name: Laboratory
  - name: Pharmacy
  - name: Billing
  - name: Reports
  - name: Matching
  - name: Notifications
  - name: System
paths:
  /:
    get:
      tags: [System]
      summary: Check that the backend is running
      responses:
        "200":
          description: Backend status
  /health:
    get:
      tags: [System]
      summary: Check backend health
      responses:
        "200":
          description: Health status
  /api/auth/signup:
    post:
      tags: [Authentication]
      summary: Create a patient or doctor account
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/SignupRequest"
      responses:
        "201":
          description: Account created
        "403":
          description: Public admin signup is not allowed
        "422":
          description: Invalid or duplicate signup details
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Sign in and receive a JWT access token
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/LoginRequest"
      responses:
        "200":
          description: Login successful
        "401":
          description: Invalid username or password
  /api/auth/logout:
    delete:
      tags: [Authentication]
      summary: Log out (remove the client-side token)
      responses:
        "204":
          description: No response body
  /api/auth/checksession:
    get:
      tags: [Authentication]
      summary: Get the authenticated user's session
      security:
        - Bearer: []
      responses:
        "200":
          description: Current user
        "401":
          description: Missing or invalid JWT
  /api/admin/dashboard:
    get:
      tags: [Administration]
      summary: Get user totals for the dashboard
      security:
        - Bearer: []
      responses:
        "200":
          description: Dashboard totals
        "401":
          description: Missing or invalid JWT
        "403":
          description: Admin role required
  /api/admin/users:
    get:
      tags: [Administration]
      summary: List and filter users
      security:
        - Bearer: []
      parameters:
        - in: query
          name: page
          type: integer
          default: 1
        - in: query
          name: per_page
          type: integer
          default: 20
        - in: query
          name: role
          type: string
          enum: [doctor, patient, admin, billing]
      responses:
        "200":
          description: Paginated users
        "401":
          description: Missing or invalid JWT
        "403":
          description: Admin role required
  /api/admin/users/{id}:
    patch:
      tags: [Administration]
      summary: Change a user's role
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/id"
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [role]
            properties:
              role:
                type: string
                enum: [doctor, patient, admin, billing]
      responses:
        "200":
          description: Updated user
        "400":
          description: Invalid role
        "401":
          description: Missing or invalid JWT
        "403":
          description: Admin role required or self-demotion is not allowed
        "404":
          description: User not found
    delete:
      tags: [Administration]
      summary: Delete a user
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/id"
      responses:
        "204":
          description: User deleted
        "401":
          description: Missing or invalid JWT
        "403":
          description: Admin role required or self-deletion is not allowed
        "404":
          description: User not found
  /api/doctors:
    get:
      tags: [Doctors]
      summary: List doctor accounts
      security:
        - Bearer: []
      responses:
        "200":
          description: Doctors
        "401":
          description: Missing or invalid JWT
        "403":
          description: Doctor, patient, or admin role required
    post:
      tags: [Doctors]
      summary: Create a doctor account
      security:
        - Bearer: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [username, speciality_id]
            properties:
              username:
                type: string
              email:
                type: string
              password:
                type: string
              speciality_id:
                type: integer
              qualification:
                type: string
              phone_number:
                type: string
              license_number:
                type: string
      responses:
        "201":
          description: Doctor created
        "401":
          description: Missing or invalid JWT
        "403":
          description: Admin role required
        "422":
          description: Invalid doctor details
  /api/doctors/{id}:
    get:
      tags: [Doctors]
      summary: Get a doctor account
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/id"
      responses:
        "200":
          description: Doctor
        "401":
          description: Missing or invalid JWT
        "404":
          description: Doctor not found
    patch:
      tags: [Doctors]
      summary: Update doctor account details
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/id"
        - in: body
          name: body
          required: true
          schema:
            type: object
            properties:
              username:
                type: string
              email:
                type: string
      responses:
        "200":
          description: Updated doctor
        "400":
          description: No supported fields
        "401":
          description: Missing or invalid JWT
        "403":
          description: Admin role required
        "404":
          description: Doctor not found
    delete:
      tags: [Doctors]
      summary: Delete a doctor account
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/id"
      responses:
        "204":
          description: Doctor deleted
        "401":
          description: Missing or invalid JWT
        "403":
          description: Admin role required
        "404":
          description: Doctor not found
  /api/patients:
    get:
      tags: [Patients]
      summary: Search and paginate patient accounts
      security:
        - Bearer: []
      parameters:
        - in: query
          name: page
          type: integer
          default: 1
        - in: query
          name: per_page
          type: integer
          default: 10
        - in: query
          name: search
          type: string
          description: Search by username or email
      responses:
        "200":
          description: Paginated patients
        "401":
          description: Missing or invalid JWT
        "403":
          description: Doctor or admin role required
    post:
      tags: [Patients]
      summary: Create a patient account
      security:
        - Bearer: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/SignupRequest"
      responses:
        "201":
          description: Patient created
        "401":
          description: Missing or invalid JWT
        "403":
          description: Admin role required
        "422":
          description: Invalid patient details
  /api/patients/{id}:
    get:
      tags: [Patients]
      summary: Get a patient by user ID
      description: The path ID is the associated user ID.
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/id"
      responses:
        "200":
          description: Patient
        "401":
          description: Missing or invalid JWT
        "403":
          description: Access denied
        "404":
          description: Patient not found
    patch:
      tags: [Patients]
      summary: Update a patient account
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/id"
        - in: body
          name: body
          required: true
          schema:
            type: object
            properties:
              username:
                type: string
              email:
                type: string
              password:
                type: string
      responses:
        "200":
          description: Updated patient
        "400":
          description: Empty update
        "401":
          description: Missing or invalid JWT
        "403":
          description: Access denied
        "404":
          description: Patient not found
    delete:
      tags: [Patients]
      summary: Delete a patient account
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/id"
      responses:
        "204":
          description: Patient deleted
        "401":
          description: Missing or invalid JWT
        "403":
          description: Admin role required
        "404":
          description: Patient not found
  /api/appointments:
    get:
      tags: [Appointments]
      summary: List appointments available to the current user
      security:
        - Bearer: []
      parameters:
        - in: query
          name: patient_id
          type: integer
        - in: query
          name: doctor_id
          type: integer
        - in: query
          name: appointment_date
          type: string
          format: date
      responses:
        "200":
          description: Appointment list
        "401":
          description: Missing or invalid JWT
        "403":
          description: Access denied
    post:
      tags: [Appointments]
      summary: Book an appointment
      security:
        - Bearer: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/AppointmentRequest"
      responses:
        "201":
          description: Appointment created
        "400":
          description: Invalid date, time, or required fields
        "401":
          description: Missing or invalid JWT
        "403":
          description: Access denied
        "409":
          description: Appointment conflicts with another booking
  /api/appointments/{appointment_id}:
    get:
      tags: [Appointments]
      summary: Get an appointment
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/appointment_id"
      responses:
        "200":
          description: Appointment details
        "401":
          description: Missing or invalid JWT
        "403":
          description: Access denied
        "404":
          description: Appointment not found
    put:
      tags: [Appointments]
      summary: Update an appointment
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/appointment_id"
        - in: body
          name: body
          required: true
          schema:
            type: object
            properties:
              patient_id:
                type: integer
              doctor_id:
                type: integer
              appointment_date:
                type: string
                format: date
              appointment_time:
                type: string
                example: "10:00"
              status:
                type: string
      responses:
        "200":
          description: Updated appointment
        "400":
          description: Invalid date or time
        "401":
          description: Missing or invalid JWT
        "403":
          description: Access denied
        "404":
          description: Appointment not found
        "409":
          description: Appointment conflicts with another booking
  /api/appointments/{appointment_id}/cancel:
    patch:
      tags: [Appointments]
      summary: Cancel an appointment
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/appointment_id"
      responses:
        "200":
          description: Appointment cancelled
        "401":
          description: Missing or invalid JWT
        "403":
          description: Access denied
        "404":
          description: Appointment not found
  /api/medical-records:
    get:
      tags: [Medical Records]
      summary: List accessible medical records
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/page"
        - $ref: "#/parameters/per_page"
        - in: query
          name: patient_id
          type: integer
        - in: query
          name: search
          type: string
      responses:
        "200":
          description: Medical records
        "401":
          description: Missing or invalid JWT
        "403":
          description: Access denied
    post:
      tags: [Medical Records]
      summary: Create a medical record
      security:
        - Bearer: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [patient_id, diagnosis, treatment]
            properties:
              patient_id:
                type: integer
              diagnosis:
                type: string
              treatment:
                type: string
      responses:
        "201":
          description: Medical record created
        "400":
          description: Invalid record details
        "401":
          description: Missing or invalid JWT
        "403":
          description: Doctor or admin role required
  /api/medical-records/{record_id}:
    get:
      tags: [Medical Records]
      summary: Get a medical record
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/record_id"
      responses:
        "200":
          description: Medical record
        "401":
          description: Missing or invalid JWT
        "403":
          description: Access denied
        "404":
          description: Record not found
    patch:
      tags: [Medical Records]
      summary: Update a medical record
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/record_id"
        - in: body
          name: body
          required: true
          schema:
            type: object
            properties:
              diagnosis:
                type: string
              treatment:
                type: string
      responses:
        "200":
          description: Updated medical record
        "400":
          description: Invalid update
        "401":
          description: Missing or invalid JWT
        "403":
          description: Doctor or admin role required
        "404":
          description: Record not found
    delete:
      tags: [Medical Records]
      summary: Delete a medical record
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/record_id"
      responses:
        "200":
          description: Record deleted
        "401":
          description: Missing or invalid JWT
        "403":
          description: Admin role required
        "404":
          description: Record not found
  /api/patients/{patient_id}/medical-history:
    get:
      tags: [Medical Records]
      summary: Get a patient's medical history
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/patient_id"
      responses:
        "200":
          description: Patient history
        "401":
          description: Missing or invalid JWT
        "403":
          description: Access denied
  /api/prescriptions:
    get:
      tags: [Prescriptions]
      summary: List accessible prescriptions
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/page"
        - $ref: "#/parameters/per_page"
        - in: query
          name: patient_id
          type: integer
        - in: query
          name: doctor_id
          type: integer
      responses:
        "200":
          description: Prescriptions
        "401":
          description: Missing or invalid JWT
        "403":
          description: Access denied
    post:
      tags: [Prescriptions]
      summary: Create a prescription
      security:
        - Bearer: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/PrescriptionRequest"
      responses:
        "201":
          description: Prescription created
        "400":
          description: Missing or invalid prescription details
        "401":
          description: Missing or invalid JWT
        "403":
          description: Doctor or admin role required
  /api/prescriptions/{prescription_id}:
    get:
      tags: [Prescriptions]
      summary: Get a prescription
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/prescription_id"
      responses:
        "200":
          description: Prescription
        "401":
          description: Missing or invalid JWT
        "403":
          description: Access denied
        "404":
          description: Prescription not found
    patch:
      tags: [Prescriptions]
      summary: Update a prescription
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/prescription_id"
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/PrescriptionRequest"
      responses:
        "200":
          description: Updated prescription
        "400":
          description: Invalid update
        "401":
          description: Missing or invalid JWT
        "403":
          description: Doctor or admin role required
        "404":
          description: Prescription not found
    delete:
      tags: [Prescriptions]
      summary: Delete a prescription
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/prescription_id"
      responses:
        "200":
          description: Prescription deleted
        "401":
          description: Missing or invalid JWT
        "403":
          description: Admin role required
        "404":
          description: Prescription not found
  /api/laboratory/tests:
    get:
      tags: [Laboratory]
      summary: List accessible laboratory tests
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/page"
        - $ref: "#/parameters/per_page"
        - in: query
          name: patient_id
          type: integer
        - in: query
          name: status
          type: string
      responses:
        "200":
          description: Laboratory tests
        "401":
          description: Missing or invalid JWT
        "403":
          description: Access denied
    post:
      tags: [Laboratory]
      summary: Request a laboratory test
      security:
        - Bearer: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [patient_id, doctor_id, test_name]
            properties:
              patient_id:
                type: integer
              doctor_id:
                type: integer
              test_name:
                type: string
      responses:
        "201":
          description: Laboratory test created
        "400":
          description: Invalid test details
        "401":
          description: Missing or invalid JWT
        "403":
          description: Doctor or admin role required
  /api/laboratory/tests/{test_id}:
    get:
      tags: [Laboratory]
      summary: Get a laboratory test
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/test_id"
      responses:
        "200":
          description: Laboratory test
        "401":
          description: Missing or invalid JWT
        "403":
          description: Access denied
        "404":
          description: Test not found
    patch:
      tags: [Laboratory]
      summary: Update a laboratory test
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/test_id"
        - in: body
          name: body
          required: true
          schema:
            type: object
            properties:
              status:
                type: string
              result:
                type: string
      responses:
        "200":
          description: Updated laboratory test
        "400":
          description: Invalid update
        "401":
          description: Missing or invalid JWT
        "403":
          description: Doctor or admin role required
        "404":
          description: Test not found
  /api/pharmacy/medicines:
    get:
      tags: [Pharmacy]
      summary: Search and paginate medicines
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/page"
        - $ref: "#/parameters/per_page"
        - in: query
          name: search
          type: string
      responses:
        "200":
          description: Medicines
        "401":
          description: Missing or invalid JWT
        "403":
          description: Doctor or admin role required
    post:
      tags: [Pharmacy]
      summary: Add a medicine
      security:
        - Bearer: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/MedicineRequest"
      responses:
        "201":
          description: Medicine added
        "400":
          description: Invalid medicine details
        "401":
          description: Missing or invalid JWT
        "403":
          description: Admin role required
  /api/pharmacy/medicines/{medicine_id}:
    get:
      tags: [Pharmacy]
      summary: Get a medicine
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/medicine_id"
      responses:
        "200":
          description: Medicine details
        "401":
          description: Missing or invalid JWT
        "403":
          description: Doctor or admin role required
        "404":
          description: Medicine not found
    patch:
      tags: [Pharmacy]
      summary: Update a medicine
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/medicine_id"
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/MedicineRequest"
      responses:
        "200":
          description: Updated medicine
        "400":
          description: Invalid update
        "401":
          description: Missing or invalid JWT
        "403":
          description: Admin role required
        "404":
          description: Medicine not found
    delete:
      tags: [Pharmacy]
      summary: Delete a medicine
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/medicine_id"
      responses:
        "200":
          description: Medicine deleted
        "401":
          description: Missing or invalid JWT
        "403":
          description: Admin role required
        "404":
          description: Medicine not found
  /api/billing/invoices:
    get:
      tags: [Billing]
      summary: List invoices
      security:
        - Bearer: []
      parameters:
        - in: query
          name: patient_id
          type: integer
        - in: query
          name: status
          type: string
      responses:
        "200":
          description: Invoices
        "401":
          description: Missing or invalid JWT
        "403":
          description: Access denied
    post:
      tags: [Billing]
      summary: Create an invoice
      security:
        - Bearer: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/InvoiceRequest"
      responses:
        "201":
          description: Invoice created
        "400":
          description: Invalid invoice details
        "401":
          description: Missing or invalid JWT
        "403":
          description: Billing staff required
  /api/billing/invoices/{invoice_id}:
    get:
      tags: [Billing]
      summary: Get an invoice
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/invoice_id"
      responses:
        "200":
          description: Invoice
        "401":
          description: Missing or invalid JWT
        "403":
          description: Access denied
        "404":
          description: Invoice not found
  /api/billing/invoices/{invoice_id}/cancel:
    post:
      tags: [Billing]
      summary: Cancel an unpaid invoice
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/invoice_id"
      responses:
        "200":
          description: Invoice cancelled
        "401":
          description: Missing or invalid JWT
        "403":
          description: Billing staff required
        "404":
          description: Invoice not found
  /api/billing/invoices/{invoice_id}/payments:
    post:
      tags: [Billing]
      summary: Record an invoice payment
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/invoice_id"
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [amount, method]
            properties:
              amount:
                type: number
              method:
                type: string
                enum: [cash, card, mobile_money, bank_transfer, insurance]
              reference:
                type: string
      responses:
        "201":
          description: Payment recorded
        "400":
          description: Invalid payment details
        "401":
          description: Missing or invalid JWT
        "403":
          description: Billing staff required
        "404":
          description: Invoice not found
  /api/billing/patients/{patient_id}/balance:
    get:
      tags: [Billing]
      summary: Get a patient's outstanding balance
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/patient_id"
      responses:
        "200":
          description: Patient balance
        "401":
          description: Missing or invalid JWT
        "403":
          description: Access denied
  /api/billing/outstanding:
    get:
      tags: [Billing]
      summary: List outstanding invoices
      security:
        - Bearer: []
      responses:
        "200":
          description: Outstanding invoices
        "401":
          description: Missing or invalid JWT
        "403":
          description: Billing staff required
  /api/reports/revenue:
    get:
      tags: [Reports]
      summary: Get a revenue report
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/start"
        - $ref: "#/parameters/end"
      responses:
        "200":
          description: Revenue report
        "401":
          description: Missing or invalid JWT
        "403":
          description: Billing staff required
  /api/reports/payments:
    get:
      tags: [Reports]
      summary: Get a payments report
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/start"
        - $ref: "#/parameters/end"
      responses:
        "200":
          description: Payments report
        "401":
          description: Missing or invalid JWT
        "403":
          description: Billing staff required
  /api/matching/doctors:
    get:
      tags: [Matching]
      summary: Find doctors by specialty and date
      security:
        - Bearer: []
      parameters:
        - in: query
          name: specialty
          type: string
        - in: query
          name: date
          type: string
          format: date
      responses:
        "200":
          description: Matching doctors
        "401":
          description: Missing or invalid JWT
  /api/notifications/{user_id}:
    get:
      tags: [Notifications]
      summary: List a user's notifications
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/user_id"
      responses:
        "200":
          description: Notifications
        "401":
          description: Missing or invalid JWT
        "403":
          description: Owner or admin role required
  /api/notifications/{user_id}/{notification_id}/read:
    patch:
      tags: [Notifications]
      summary: Mark a notification as read
      security:
        - Bearer: []
      parameters:
        - $ref: "#/parameters/user_id"
        - $ref: "#/parameters/notification_id"
      responses:
        "200":
          description: Notification marked as read
        "401":
          description: Missing or invalid JWT
        "403":
          description: Owner or admin role required
        "404":
          description: Notification not found
